name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Build client
        run: npm --prefix client run build

      - name: Server tests (PGlite-backed, no external DB needed)
        run: npm --prefix server test

      # Blocking since Phase 4.5 — live code is clean; legacy files queued
      # for the UI redo are exempted in .eslintrc.json ignorePatterns.
      - name: Lint
        run: npm run lint
