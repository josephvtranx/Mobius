<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_ds/mobius-design-system-e58882f7-3aa9-4204-9c0e-3536d0f0c77d/fonts/fonts.css">
<link rel="stylesheet" href="_ds/mobius-design-system-e58882f7-3aa9-4204-9c0e-3536d0f0c77d/_ds_bundle.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0f1420}
  a{color:#5b8cff;text-decoration:none}a:hover{color:#8fb0ff}
  .ad-in{width:100%;height:46px;border-radius:11px;border:1px solid #263049;background:#0f1420;color:#e8ecf5;padding:0 14px;font:400 14px 'Noto Sans KR',system-ui,sans-serif;outline:none}
  .ad-in:focus{border-color:#5b8cff;box-shadow:0 0 0 3px rgba(91,140,255,.18)}
  .ad-in::placeholder{color:#5c6d92}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(800px 500px at 50% -10%,#182031 0,#0f1420 60%);font-family:'Noto Sans KR',system-ui,sans-serif;color:#e8ecf5;padding:24px">
  <div style="width:min(420px,100%)">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#8fa3c8">Mobius · Platform admin</div>
      <h1 style="margin:8px 0 0;font-size:30px;font-weight:600;letter-spacing:-.02em">Console</h1>
    </div>
    <div style="background:#182031;border:1px solid #263049;border-radius:18px;padding:32px 30px">
      <sc-if value="{{ expired }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#8fa3c8;background:#0f1420;border:1px solid #263049;border-radius:11px;padding:12px 14px;margin-bottom:18px"><i class="fa-regular fa-clock" style="color:#5b8cff;margin-top:2px"></i>Your session ended after 120 minutes. Sign in again to continue.</div>
      </sc-if>
      <div style="margin-bottom:16px">
        <label for="ad-email" style="display:block;font-size:12.5px;font-weight:500;color:#8fa3c8;margin-bottom:7px">Email</label>
        <input id="ad-email" class="ad-in" type="email" placeholder="you@mobius.dev" onInput="{{ clearErr }}">
      </div>
      <div style="margin-bottom:8px">
        <label for="ad-pass" style="display:block;font-size:12.5px;font-weight:500;color:#8fa3c8;margin-bottom:7px">Password</label>
        <input id="ad-pass" class="ad-in" type="password" placeholder="••••••••" onInput="{{ clearErr }}">
      </div>
      <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="font-size:13px;color:#ff9a9a;border:1px solid #5a2b2b;background:rgba(90,43,43,.18);border-radius:10px;padding:10px 13px;margin-top:10px">{{ errMsg }}</div>
      </sc-if>
      <button onClick="{{ submit }}" style="width:100%;height:46px;margin-top:20px;border:none;border-radius:11px;background:#5b8cff;color:#0f1420;font:600 14px 'Noto Sans KR',system-ui,sans-serif;cursor:pointer">Sign in</button>
    </div>
    <div style="text-align:center;font-size:12px;color:#5c6d92;margin-top:18px">Internal tool · platform accounts only<br>Demo: any email + any password signs in</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { err:'', expired:false };
  clearErr = () => { if(this.state.err) this.setState({ err:'' }); };
  submit = () => {
    const e=document.getElementById('ad-email'), p=document.getElementById('ad-pass');
    const ev=e?e.value.trim():'', pv=p?p.value:'';
    if(!ev || !pv){ this.setState({ err:'Email and password are required.' }); return; }
    window.location.href='Mobius Admin.dc.html';
  };
  renderVals(){
    return { clearErr:this.clearErr, submit:this.submit, hasErr:!!this.state.err, errMsg:this.state.err, expired:this.state.expired };
  }
}
</script>
</body>
</html>
